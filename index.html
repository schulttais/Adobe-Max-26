<style>
/* Layout: an iOS-style app. Large title per tab, inset grouped lists, one black MAX hero card, a bottom tab bar, and details in a slide-up sheet. */
:root {
  --sat: 0px;
  --bg: #F2F2F7; --card: #FFFFFF; --card2: #F7F7FA; --label: #000000; --label2: #6C6C72; --label3: #8E8E93;
  --sep: rgba(60,60,67,.18); --fill: rgba(118,118,128,.12); --press: rgba(0,0,0,.05);
  --tint: #D70F00; --must: #D70F00; --high: #0A2C8F; --med: #8E8E93; --net: #1F7A7C; --pin: #1C1C1E; --pin-t: #FFFFFF;
  --ok: #3E7A1E; --ok-bg: #EAF4E1; --walk: #8F5508; --walk-bg: #FBF0DE; --res: #0B6A86; --res-bg: #E1F2F8;
  --tue: #1F7F82; --wed: #C8285E; --thu: #0A2C8F;
  --hero: #0B0B0D; --bar: rgba(249,249,251,.86);
  --m-bldg: #FFFFFF; --m-edge: #D1D1D6; --m-zone: #F2F2F7; --m-hall: #E9E9EE; --m-hl: #FDE7EC; --m-cp: #FCEFF2; --m-hl-edge: #E0245E; --m-text: #1C1C1E; --m-text2: #6C6C72; --m-faint: #A1A1A8;
  --max: linear-gradient(90deg, #EB1000 0%, #FC4B84 30%, #2C8E91 62%, #012579 86%, #D1BE4E 100%);
  --f: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --card: #1C1C1E; --card2: #2C2C2E; --label: #FFFFFF; --label2: #A1A1A8; --label3: #7C7C83;
  --sep: rgba(84,84,88,.55); --fill: rgba(118,118,128,.24); --press: rgba(255,255,255,.06);
  --tint: #FF5544; --must: #FF5544; --high: #93A9FF; --med: #8E8E93; --net: #5CC8CA; --pin: #F2F2F7; --pin-t: #000000;
  --ok: #A6D36B; --ok-bg: #1E2A14; --walk: #F0B261; --walk-bg: #33240F; --res: #66D0EC; --res-bg: #0F2F38;
  --tue: #4FC0C3; --wed: #F2709B; --thu: #93A9FF;
  --hero: #0B0B0D; --bar: rgba(22,22,24,.86);
  --m-bldg: #1C1C1E; --m-edge: #3A3A3C; --m-zone: #2C2C2E; --m-hall: #26262A; --m-hl: #3B1822; --m-cp: #2E1A21; --m-hl-edge: #FF5C86; --m-text: #F2F2F7; --m-text2: #A1A1A8; --m-faint: #6E6E75;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #000000; --card: #1C1C1E; --card2: #2C2C2E; --label: #FFFFFF; --label2: #A1A1A8; --label3: #7C7C83;
  --sep: rgba(84,84,88,.55); --fill: rgba(118,118,128,.24); --press: rgba(255,255,255,.06);
  --tint: #FF5544; --must: #FF5544; --high: #93A9FF; --med: #8E8E93; --net: #5CC8CA; --pin: #F2F2F7; --pin-t: #000000;
  --ok: #A6D36B; --ok-bg: #1E2A14; --walk: #F0B261; --walk-bg: #33240F; --res: #66D0EC; --res-bg: #0F2F38;
  --tue: #4FC0C3; --wed: #F2709B; --thu: #93A9FF;
  --hero: #0B0B0D; --bar: rgba(22,22,24,.86);
  --m-bldg: #1C1C1E; --m-edge: #3A3A3C; --m-zone: #2C2C2E; --m-hall: #26262A; --m-hl: #3B1822; --m-cp: #2E1A21; --m-hl-edge: #FF5C86; --m-text: #F2F2F7; --m-text2: #A1A1A8; --m-faint: #6E6E75;
  color-scheme: dark }
html.pwa { --sat: env(safe-area-inset-top, 0px) }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
[hidden] { display: none !important }
html, body { background: var(--bg) }
body { margin: 0; font-family: var(--f); color: var(--label); font-size: 17px; line-height: 1.35; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100% }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: max(var(--sat), env(safe-area-inset-top, 0px)); z-index: 30; background: var(--bg) }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left }
a { color: var(--tint); text-decoration: none }
:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; border-radius: 8px }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)) }
main { padding-block: calc(var(--sat) + 14px) calc(96px + env(safe-area-inset-bottom, 0px)) }
.view { display: grid; gap: 22px }

/* large title */
.lt { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 6px }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--label2) }
.lt h1 { margin: 2px 0 0; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -.02em }
.grad { background: var(--max); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #fff; background: radial-gradient(circle at 70% 30%, #FC4B84 0 30%, transparent 31%), linear-gradient(135deg, #012579, #2C8E91); flex: none; margin-bottom: 2px }

/* hero */
.hero { position: relative; overflow: hidden; background: var(--hero); color: #fff; border-radius: 20px; padding: 18px 18px 16px; min-height: 196px; display: grid; align-content: end; gap: 6px; border: 1px solid rgba(255,255,255,.06) }
.hero svg.art { position: absolute; right: -34px; top: -40px; width: 210px; height: 210px; pointer-events: none }
.hero > * { position: relative }
.h-eye { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: rgba(255,255,255,.72) }
.live { width: 8px; height: 8px; border-radius: 50%; background: #FF3B30; box-shadow: 0 0 0 4px rgba(255,59,48,.25) }
.hero h2 { margin: 0; font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -.015em; max-width: 84%; text-wrap: balance }
.h-meta { max-width: 84% }
.h-meta { font-size: 15px; color: rgba(255,255,255,.78); font-variant-numeric: tabular-nums }
.h-acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap }
.pill-btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: 600 }
.pill-btn.light { background: #fff; color: #000 }
.pill-btn.glass { background: rgba(255,255,255,.16); color: #fff }
.h-next { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.14); font-size: 14px; color: rgba(255,255,255,.7) }
.h-next b { color: #fff; font-weight: 600 }

/* sections and inset grouped lists */
.sec { display: grid; gap: 8px }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px }
.sec-h h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em }
.sec-h button, .sec-h a { color: var(--tint); font-size: 15px }
.sec-note { padding: 0 4px; font-size: 13px; color: var(--label2) }
.group { background: var(--card); border-radius: 14px; overflow: hidden }
.row { width: 100%; display: grid; grid-template-columns: 54px 1fr 14px; align-items: center; gap: 12px; padding: 11px 14px 11px 16px; position: relative; min-height: 58px }
.row + .row::before, .rowgap + .row::before, .row + .rowgap::before { content: ""; position: absolute; top: 0; right: 0; left: 82px; height: 1px; background: var(--sep); transform: scaleY(.6) }
.row:active { background: var(--press) }
.row.plain { grid-template-columns: 30px 1fr 14px }
.row.plain + .row::before, .row + .row.plain::before { left: 58px }
.rt { font-variant-numeric: tabular-nums; display: grid; line-height: 1.1 }
.rt b { font-size: 17px; font-weight: 600; letter-spacing: -.01em }
.rt small { font-size: 11.5px; color: var(--label2); font-weight: 600; margin-top: 2px }
.rm { min-width: 0; display: grid; gap: 2px }
.rtitle { font-size: 16px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.rsub { font-size: 13.5px; color: var(--label2); display: flex; align-items: center; gap: 6px; min-width: 0 }
.rsub span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--med); flex: none }
.dot.must { background: var(--must) } .dot.high { background: var(--high) } .dot.network { background: var(--net) } .dot.optional { background: transparent; box-shadow: inset 0 0 0 1.5px var(--med) } .dot.travel { background: #0190CD }
.chev { width: 9px; height: 15px; color: var(--label3) }
.row.now { background: linear-gradient(90deg, rgba(235,16,0,.08), transparent 70%) }
.row.now .rt b { color: var(--must) }
.nowtag { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--must) }
.rowgap { position: relative; padding: 9px 16px 9px 82px; font-size: 13px; color: var(--label2); background: var(--card2) }
.rowgap b { font-weight: 600; color: var(--label2); font-variant-numeric: tabular-nums; margin-right: 6px }
.ico { width: 30px; height: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: #fff }
.ico svg { width: 17px; height: 17px }

/* segmented control */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 2px; border-radius: 9px; background: var(--fill) }
.seg button { height: 30px; border-radius: 7px; font-size: 14px; font-weight: 500; text-align: center; color: var(--label) }
.seg button[aria-pressed="true"] { background: var(--card); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04) }
.dayinfo { padding: 0 4px; font-size: 14px; color: var(--label2) }
.dayinfo b { color: var(--label); font-weight: 600 }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--sep); padding: 6px max(10px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-right, 0px)) }
.tabbar nav { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr) }
.tabbar button { display: grid; justify-items: center; gap: 2px; padding: 3px 0; font-size: 10.5px; font-weight: 500; color: var(--label3) }
.tabbar svg { width: 25px; height: 25px }
.tabbar button[aria-selected="true"] { color: var(--tint) }

/* map */
.mapcard { background: var(--card); border-radius: 18px; padding: 10px }
.vm { width: 100%; height: auto; display: block; max-width: 460px; margin: 0 auto }
.vm text { font-family: var(--f) }
.vm .m-bldg { fill: var(--m-bldg); stroke: var(--m-edge); stroke-width: 1.5 }
.vm .m-zone { fill: var(--m-zone) }
.vm .m-hall { fill: var(--m-hall) }
.vm .m-hl { fill: var(--m-hl); stroke: var(--m-hl-edge); stroke-width: 2 }
.vm .m-cp { fill: var(--m-cp); stroke: var(--m-hl-edge); stroke-width: 2 }
.vm .m-l2 { fill: var(--m-bldg); stroke: var(--m-hl-edge); stroke-width: 2 }
.vm .m-div { stroke: var(--m-hl-edge); stroke-opacity: .25; stroke-width: 1.5 }
.vm .m-dash { stroke: var(--m-faint); stroke-width: 1.5; stroke-dasharray: 3 3; fill: none }
.vm .m-ink { fill: var(--m-text) }
.vm .m-pin { fill: var(--pin) }
.vm .pc0 { fill: var(--m-hl-edge); opacity: 0 }
.vm .t-st { font-size: 10px; fill: var(--m-faint); letter-spacing: .06em; text-transform: uppercase; font-weight: 600 }
.vm .t-strong { fill: var(--m-text) }
.vm .t-lab2 { font-size: 9.5px; fill: var(--m-faint); letter-spacing: .06em; text-transform: uppercase; font-weight: 600 }
.vm .t-zone { font-size: 15px; font-weight: 600; fill: var(--m-text2) }
.vm .t-big { font-size: 20px; font-weight: 700; fill: var(--m-text); letter-spacing: -.01em }
.vm .t-mid { font-size: 14.5px; font-weight: 600; fill: var(--m-text) }
.vm .t-sub { font-size: 10.5px; fill: var(--m-text2) }
.vm .t-note { font-size: 9.5px; fill: var(--m-hl-edge); font-style: italic }
.vm .t-l2 { font-size: 8.5px; font-weight: 700; fill: var(--m-hl-edge); letter-spacing: .1em }
.vm .t-pin { font-size: 11px; font-weight: 700; fill: var(--pin-t) }
.vm .place { cursor: pointer; transition: opacity .2s }
.vm .place.dim { opacity: .2 }
.vm .place.sel .ring { stroke-width: 3.5 }
.vm .pulse { animation: pulse 1.2s ease-out 3 }
@keyframes pulse { 0% { r: 11; opacity: .6 } 100% { r: 26; opacity: 0 } }
.pnum { width: 24px; height: 24px; border-radius: 50%; background: var(--pin); color: var(--pin-t); font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; line-height: 1; flex: none }
.pnum.q { background: var(--label3) }

/* people */
.pav { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff; background: #8E8E93 }
.pav.t1 { background: linear-gradient(135deg, #EB1000, #FC4B84 45%, #2C8E91) }
.row.person { grid-template-columns: 40px 1fr 14px }
.row.person + .row.person::before { left: 68px }

/* sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 50 }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.38); opacity: 0; transition: opacity .25s }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: 680px; margin: 0 auto; max-height: calc(100% - 36px - max(var(--sat), env(safe-area-inset-top, 0px))); background: var(--bg); border-radius: 14px 14px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -10px 40px rgba(0,0,0,.18) }
.sheet-wrap.open .scrim { opacity: 1 }
.sheet-wrap.open .sheet { transform: none }
.sh-bar { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 6px; flex: none }
.grab { position: absolute; top: 6px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--label3); opacity: .5 }
.sh-bar button { color: var(--tint); font-size: 17px; min-height: 32px }
.sh-bar .done { font-weight: 600; margin-left: auto }
.sh-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px max(18px, env(safe-area-inset-left, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start }
.sh-title { display: grid; gap: 4px }
.sh-title h2 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; text-wrap: balance }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px }
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--fill); color: var(--label) }
.tag.must { background: var(--must); color: #fff } .tag.high { background: var(--high); color: var(--card) } .tag.network { background: var(--net); color: var(--card) }
.tag.reserve { background: var(--res-bg); color: var(--res) } .tag.walkin { background: var(--walk-bg); color: var(--walk) } .tag.nobook { background: var(--ok-bg); color: var(--ok) }
.tag.once { background: transparent; box-shadow: inset 0 0 0 1px var(--must); color: var(--must) }
.card { background: var(--card); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px }
.card h3 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--label2) }
.card p { margin: 0; font-size: 16px; line-height: 1.45 }
.card .small { font-size: 14px; color: var(--label2) }
.loccard { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center }
.loccard b { font-size: 17px; font-weight: 600; display: block }
.loccard span { font-size: 14px; color: var(--label2) }
.mapbtn { height: 32px; padding: 0 14px; border-radius: 999px; background: var(--fill); color: var(--tint); font-size: 15px; font-weight: 600 }
.cta { display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 14px; background: var(--tint); color: #fff; font-size: 17px; font-weight: 600 }
.cta.sec2 { background: var(--card); color: var(--tint) }
.pbcard { background: var(--card); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; border-left: 4px solid var(--fill) }
.pbcard .pbt { font-size: 13px; font-weight: 600; color: var(--label2); font-variant-numeric: tabular-nums }
.pbcard h4 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.3 }
.pbcard .why2 { font-size: 15px; color: var(--label2); line-height: 1.4 }
.pbacts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px }
.socials { display: flex; flex-wrap: wrap; gap: 8px }
.socials a { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--card); font-size: 15px; font-weight: 600 }
.socials a span { color: var(--label2); font-weight: 500; margin-right: 6px }
.plist { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px }
.plist li { font-size: 15.5px; line-height: 1.45; padding-left: 16px; position: relative }
.plist li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 6px; height: 6px; border-radius: 50%; background: var(--label3) }
.plist b { font-weight: 600 }
.foot { padding: 4px 4px 0; font-size: 12.5px; color: var(--label3); display: grid; gap: 4px }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
</style>

const store = { get(k) { try { return localStorage.getItem(k) } catch (e) { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch (e) {} } };
const CHEV = '<svg class="chev" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5 7.5 7.5 1.5 13.5"/></svg>';
const ART = '<svg class="art" viewBox="0 0 230 230" aria-hidden="true"><defs><linearGradient id="ha" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FC4B84"/><stop offset="1" stop-color="#EB1000"/></linearGradient><linearGradient id="hb" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#012579"/><stop offset="1" stop-color="#2C8E91"/></linearGradient></defs><circle cx="150" cy="84" r="76" fill="url(#hb)"/><path d="M150 8 A76 76 0 0 1 226 84 L150 84 Z" fill="url(#ha)"/><circle cx="52" cy="70" r="9" fill="none" stroke="url(#ha)" stroke-width="4.5"/><circle cx="170" cy="196" r="12" fill="#D1BE4E"/></svg>';
const st = { tab: 'today', day: 'tue', mapDay: 'all', pin: null };

/* time in Miami */
const fmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const fmtLong = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'long', month: 'long', day: 'numeric' });
function nowNY() { const p = Object.fromEntries(fmt.formatToParts(new Date()).map(x => [x.type, x.value])); return { iso: `${p.year}-${p.month}-${p.day}`, min: (+p.hour % 24) * 60 + +p.minute } }
const dur = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ' ' + (m % 60) + ' min' : ''}`;
const dayDiff = (a, b) => Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 864e5);
const TL = [];
D.days.forEach((d, di) => d.items.forEach(it => { if (it.kind === 's' || it.kind === 't') TL.push({ it, d, di, a: di * 1440 + it.s, b: di * 1440 + it.e }) }));
function position() {
  const n = nowNY(), di = D.days.findIndex(d => d.iso === n.iso);
  if (di >= 0) return { phase: 'during', abs: di * 1440 + n.min, di, n };
  if (n.iso < D.days[0].iso) return { phase: 'before', days: dayDiff(n.iso, D.days[0].iso), n };
  return { phase: 'after', n };
}
const findItem = (dk, code) => { const d = D.days.find(x => x.key === dk); for (const it of d.items) { if (it.kind !== 's') continue; if (it.code === code) return { d, it, plan: false }; if (!it.b.alt && it.b.code === code) return { d, it, plan: true } } return null };

/* rows */
function sub(it) {
  const pr = (it.prio === 'must' || it.prio === 'high' || it.prio === 'network') ? `${PRIO[it.prio]} · ` : '';
  return `<span class="rsub"><i class="dot ${it.prio}"></i><span>${pr}${esc(it.room)}</span></span>`;
}
function rowsFor(d, opts = {}) {
  const p = position(), di = D.days.indexOf(d), cur = p.phase === 'during' && p.di === di ? p.n.min : -1;
  return d.items.map(it => {
    if (it.kind === 'g') return opts.noGaps ? '' : `<div class="rowgap"><b>${it.start} to ${it.end} ${it.eap}</b>${esc(it.text)}</div>`;
    const isNow = cur >= it.s && cur < it.e;
    if (it.kind === 't') return `<button class="row${isNow ? ' now' : ''}" data-open="t:${d.key}"><span class="rt"><b>2:20</b><small>PM</small></span><span class="rm"><span class="rtitle">Leave for the 4:00 pm Brightline</span><span class="rsub"><i class="dot travel"></i><span>MiamiCentral station</span></span></span>${CHEV}</button>`;
    return `<button class="row${isNow ? ' now' : ''}" data-open="s:${d.key}:${it.code}"><span class="rt"><b>${it.start}</b><small>${it.ap.toUpperCase()}</small></span><span class="rm">${isNow ? '<span class="nowtag">Now</span>' : ''}<span class="rtitle">${esc(it.title)}</span>${sub(it)}</span>${CHEV}</button>`;
  }).join('');
}

/* today */
function hero() {
  const p = position();
  if (p.phase === 'before') {
    const f = TL[0].it;
    return `<div class="hero">${ART}<div class="h-eye">Adobe MAX 2026 · Miami Beach</div><h2>Starts in ${p.days} ${p.days === 1 ? 'day' : 'days'}</h2><div class="h-meta">First up ${esc(f.title)}, Tue 9:00 am in ${esc(f.room)}</div>
      <div class="h-acts"><button class="pill-btn light" data-open="i:booking">Book by Oct 20</button><button class="pill-btn glass" data-open="s:tue:${f.code}">Details</button></div></div>`;
  }
  if (p.phase === 'after') return `<div class="hero">${ART}<div class="h-eye">Adobe MAX 2026</div><h2>That's a wrap</h2><div class="h-meta">Everything stays here for reference.</div></div>`;
  const cur = TL.filter(x => x.a <= p.abs && p.abs < x.b && x.it.kind === 's').pop();
  const nxt = TL.find(x => x.a > p.abs);
  const block = (x, eye) => {
    const it = x.it;
    if (it.kind === 't') return `<div class="h-eye">${eye}</div><h2>Leave for Brightline</h2><div class="h-meta">2:20 pm · train at 4:00 pm from MiamiCentral</div><div class="h-acts"><button class="pill-btn light" data-open="t:thu">Details</button></div>`;
    return `<div class="h-eye">${eye}</div><h2>${esc(it.title)}</h2><div class="h-meta">${it.start} to ${it.end} ${it.eap} · ${esc(it.room)}</div>
      <div class="h-acts"><button class="pill-btn light" data-open="s:${x.d.key}:${it.code}">Details</button>${it.pin ? `<button class="pill-btn glass" data-map="${it.pin}" data-mday="${x.d.key}">Map</button>` : ''}</div>`;
  };
  if (cur) return `<div class="hero">${ART}${block(cur, `<span class="live"></span>Now · ${dur(cur.b - p.abs)} left`)}${nxt ? `<div class="h-next">Next <b>${nxt.it.kind === 't' ? 'Leave for Brightline' : esc(nxt.it.title)}</b> at ${nxt.it.start} ${nxt.it.ap}</div>` : ''}</div>`;
  if (nxt) return `<div class="hero">${ART}${block(nxt, nxt.di === p.di ? `Up next · in ${dur(nxt.a - p.abs)}` : `Up next · ${nxt.d.name}`)}</div>`;
  return `<div class="hero">${ART}<div class="h-eye">${D.days[p.di].name}</div><h2>Done for today</h2><div class="h-meta">Rest up for tomorrow.</div></div>`;
}
function renderToday() {
  const p = position();
  const d = p.phase === 'during' ? D.days[p.di] : p.phase === 'after' ? D.days[2] : D.days[0];
  const eyebrow = p.phase === 'during' ? fmtLong.format(new Date()) : p.phase === 'before' ? `${p.days} days to MAX` : 'Adobe MAX 2026';
  const label = p.phase === 'during' ? 'Today' : `${LONG[d.key]}, ${d.date}`;
  $('#v-today').innerHTML = `
    <div class="lt"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>Mo's <span class="grad">MAX</span></h1></div><button class="avatar" data-open="i:about" aria-label="About this app">M</button></div>
    ${hero()}
    <div class="sec"><div class="sec-h"><h2>${esc(label)}</h2><button data-tab-go="agenda" data-day="${d.key}">See all</button></div>

      ${info('about', '#8E8E93', 'Sources and about', 'Official catalog, FAQ, floor plans', '<circle cx="14" cy="14" r="9.5"/><path d="M14 13v6M14 9.2v.2"/>')}

/* agenda */
function renderAgenda() {

/* map */
const PLACES = {};
D.days.forEach(d => d.items.forEach(it => {
  if (it.kind !== 's') return;
  const add = (o, role) => { if (o && o.pin) (PLACES[o.pin] ||= []).push({ d, o, role, main: it }) };
  add(it, 'main'); if (!it.b.alt) add(it.b, 'b');
}));
function renderMap() {
  $('#mapseg').innerHTML = [['all', 'All'], ...D.days.map(d => [d.key, d.name.slice(0, 3)])].map(([k, l]) => `<button aria-pressed="${st.mapDay === k}" data-mapday="${k}">${l}</button>`).join('');
  document.querySelectorAll('.vm .place').forEach(g => {
    const n = +g.dataset.pin, l = PLACES[n] || [];
    g.classList.toggle('dim', !(st.mapDay === 'all' ? l.length : l.some(x => x.d.key === st.mapDay)));

  $('#places').innerHTML = Object.entries(D.pins).map(([n, p]) => {
    const l = (PLACES[n] || []).filter(x => st.mapDay === 'all' || x.d.key === st.mapDay);
    return `<button class="row plain" data-open="p:${n}" ${l.length ? '' : 'style="opacity:.45"'}><span class="pnum">${n}</span><span class="rm"><span class="rtitle">${esc(p.name)}</span><span class="rsub"><span>${l.length ? l.length + (l.length === 1 ? ' session' : ' sessions') : 'Nothing this day'} · ${esc(p.desc.split('.')[0])}</span></span></span>${CHEV}</button>`;

}

/* sheets */
const stack = [];
function openSheet(fn, push) {
  if (push && stack.length) stack.push(fn); else { stack.length = 0; stack.push(fn) }
  draw();
  const w = $('#sheet');
  if (w.hidden) { w.hidden = false; document.body.style.overflow = 'hidden'; requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add('open'))) }
}
function draw() { $('#shbody').innerHTML = stack[stack.length - 1](); $('#sh-back').hidden = stack.length < 2; $('#shbody').scrollTop = 0 }
function closeSheet(fast) {
  const w = $('#sheet'); if (w.hidden) return;
  w.classList.remove('open'); document.body.style.overflow = '';
  const fin = () => { w.hidden = true; stack.length = 0 };
  fast ? fin() : setTimeout(fin, 300);
}
const tagB = b => b ? `<span class="tag ${b.k}">${esc(b.t)}</span>` : '';
const catBtn = code => `<a class="cta" href="${D.cat}${code}" target="_blank" rel="noopener">Open ${code} in the catalog</a>`;
function sessionSheet(dk, code) {
  const f = findItem(dk, code); if (!f) return '<p>Not found.</p>';
  const { d, it, plan } = f;
  const o = plan ? it.b : it;
  const area = [o.area, o.cap ? `${o.cap.toLocaleString('en-US')} seats` : ''].filter(Boolean).join(' · ');
  const loc = `<div class="card loccard">${o.pin ? `<span class="pnum">${o.pin}</span>` : '<span class="pnum q">?</span>'}<div><b>${esc(o.room)}</b><span>${esc(area || 'Venue not named yet in the catalog')}</span></div>${o.pin ? `<button class="mapbtn" data-map="${o.pin}" data-mday="${d.key}">Map</button>` : ''}</div>`;
  let html = `<div class="sh-title"><div class="eyebrow">${LONG[d.key]} · ${o.start} ${o.ap} to ${o.end} ${o.eap}${plan ? ' · Plan B' : ''}</div><h2>${esc(o.title)}</h2>
    <div class="tags">${plan ? '' : `<span class="tag ${it.prio}">${PRIO[it.prio]}</span>`}${tagB(o.book)}${!plan && it.once ? '<span class="tag once">Only time it runs</span>' : ''}<span class="tag">${esc(o.type)} · ${o.code}</span></div></div>
    ${loc}
    <div class="card"><h3>${plan ? 'Why it is the plan B' : 'Why it matters'}</h3><p>${esc(o.why)}</p></div>
    <div class="card"><h3>Speakers</h3><p class="small">${esc(o.speakers)}</p></div>`;
  if (!plan && it.note) html += `<div class="card"><h3>Lab credit</h3><p class="small">${esc(it.note)}</p></div>`;
  if (plan) html += `<div class="sec"><div class="sec-h"><h2>Main pick in this slot</h2></div><div class="group"><button class="row" data-push="s:${d.key}:${it.code}"><span class="rt"><b>${it.start}</b><small>${it.ap.toUpperCase()}</small></span><span class="rm"><span class="rtitle">${esc(it.title)}</span>${sub(it)}</span>${CHEV}</button></div></div>`;
  else {
    const b = it.b;
    html += `<div class="sec"><div class="sec-h"><h2>Plan B</h2></div>` + (b.alt ? `<div class="card"><p class="small">${esc(b.alt)}</p></div>` :
      `<div class="pbcard"><span class="pbt">${b.start} ${b.ap} to ${b.end} ${b.eap} · ${esc(b.type)} · ${b.code}</span><h4>${esc(b.title)}</h4><span class="small" style="font-size:14px;color:var(--label2)">${esc(b.room)}${b.area ? ' · ' + esc(b.area) : ''}</span><span class="why2">${esc(b.why)}</span>

  }
  return html + catBtn(o.code);
}

      <li><b>Labs.</b> Room 232 on Wednesday and Room 222 on Thursday, both on Level 2.</li>
      <li><b>The Fillmore.</b> 1700 Washington Ave, at the south end of the campus.</li>
      <li><b>Address.</b> 1901 Convention Center Dr, Miami Beach.</li></ul></div>
    <button class="cta sec2" data-tab-go="map">Open the map</button>`,
  about: () => `<div class="sh-title"><div class="eyebrow">About</div><h2>Mo's MAX</h2></div>
    <div class="card"><p class="small">Personal agenda for Adobe MAX 2026, Nov 10 to 12 in Miami Beach. Built from the official session catalog and FAQ, read Oct 16, 2026. Times are Miami time. Not produced by Adobe.</p></div>
    <div class="group">
      <a class="row plain" href="${D.cat}" target="_blank" rel="noopener"><span class="ico" style="background:#D70F00">↗</span><span class="rm"><span class="rtitle">Session catalog</span><span class="rsub"><span>reg.adobe.com</span></span></span>${CHEV}</a>
      <a class="row plain" href="https://max.adobe.com/faq/" target="_blank" rel="noopener"><span class="ico" style="background:#2C8E91">↗</span><span class="rm"><span class="rtitle">Adobe MAX FAQ</span><span class="rsub"><span>max.adobe.com</span></span></span>${CHEV}</a>
      <a class="row plain" href="https://www.miamibeachconvention.com/floor-plans-campus-map" target="_blank" rel="noopener"><span class="ico" style="background:#012579">↗</span><span class="rm"><span class="rtitle">Venue floor plans</span><span class="rsub"><span>miamibeachconvention.com</span></span></span>${CHEV}</a>
    </div>`,
};
function route(key, push) {
  const [k, a, b] = key.split(':');
  const fn = k === 's' ? () => sessionSheet(a, b) : k === 't' ? trainSheet : k === 'p' ? () => placeSheet(+a) : k === 'u' ? () => personSheet(+a) : () => INFO[a]();
  openSheet(fn, push);
}

/* tabs */
function setTab(t) {
  st.tab = t; store.set('mo-max-tab', t);
  document.querySelectorAll('.tabbar button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  ['today', 'agenda', 'map', 'people'].forEach(v => $('#v-' + v).hidden = v !== t);
  if (t === 'map') renderMap();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-close],[data-open],[data-push],[data-map],[data-tab],[data-tab-go],[data-day-pick],[data-mapday],.vm .place,#sh-back');
  if (!el) return;
  if (el.id === 'sh-back') { stack.pop(); draw(); return }
  if (el.hasAttribute('data-close')) { closeSheet(); return }
  if (el.dataset.map) { goMap(el.dataset.map, el.dataset.mday); return }
  if (el.dataset.push) { route(el.dataset.push, true); return }
  if (el.dataset.open) { route(el.dataset.open, false); return }
  if (el.dataset.tabGo) { closeSheet(true); if (el.dataset.day) { st.day = el.dataset.day; renderAgenda() } setTab(el.dataset.tabGo); window.scrollTo(0, 0); return }
  if (el.dataset.tab) { setTab(el.dataset.tab); window.scrollTo(0, 0); return }
  if (el.dataset.dayPick) { st.day = el.dataset.dayPick; store.set('mo-max-day', st.day); renderAgenda(); return }
  if (el.dataset.mapday) { st.mapDay = el.dataset.mapday; renderMap(); return }
  if (el.classList.contains('place')) { st.pin = +el.dataset.pin; renderMap(); route('p:' + el.dataset.pin, false) }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('place')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })) }
});

(function init() {
  const p = position();
  st.day = p.phase === 'during' ? D.days[p.di].key : (store.get('mo-max-day') || 'tue');
  st.mapDay = p.phase === 'during' ? D.days[p.di].key : 'all';
  const nx = p.phase === 'during' ? TL.find(x => x.a > p.abs && x.it.pin) : TL[0];
  st.pin = nx && nx.it.pin ? nx.it.pin : 1;
  renderToday(); renderAgenda(); renderPeople(); renderMap();
  const h = (location.hash || '').slice(1);
  setTab(['today', 'agenda', 'map', 'people'].includes(h) ? h : 'today');
  setInterval(() => { renderToday(); if (position().phase === 'during') renderAgenda() }, 60000);
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})) }
</script>
</body>
</html>
